<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bản Đồ Tránh Kẹt Xe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- CẤU HÌNH DÀNH RIÊNG CHO IPHONE PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bản Đồ">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.json?v=3">
  <meta name="theme-color" content="#2563eb">

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Font & Style (Cache Busted) -->
  <link rel="stylesheet" href="style.css?v=20261029_2345">

  <script>
    // Tự động xóa sạch Cache cũ của Service Worker để luôn tải bản mới nhất
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let r of registrations) { r.unregister(); }
      });
    }
  </script>
</head>
<body>

  <!-- Bản đồ toàn màn hình -->
  <div id="map"></div>

  <!-- Thanh tìm kiếm trên đỉnh -->
  <div class="top-bar">
    <div class="search-box">
      <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="searchInput" placeholder="Tìm điểm đến (ví dụ: ĐH Khoa học Tự nhiên, Chợ Bến Thành...)" autocomplete="off">
      <button id="clearSearchBtn" class="clear-btn" style="display: none;">✕</button>
    </div>
    
    <!-- Danh sách gợi ý địa điểm -->
    <div id="searchResults" class="search-results" style="display: none;"></div>
  </div>

  <!-- CỤM NÚT ĐIỀU KHIỂN GÓC PHẢI TRÊN (KHÔNG BAO GIỜ BỊ CHE) -->
  <div class="top-controls">
    <!-- Nút Vệ Tinh (Google Satellite Hybrid) -->
    <button id="satelliteToggleBtn" class="control-btn" title="Chuyển sang ảnh Vệ tinh">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
        <line x1="8" y1="2" x2="8" y2="18"></line>
        <line x1="16" y1="6" x2="16" y2="22"></line>
      </svg>
      <span>Vệ tinh</span>
    </button>

    <!-- Nút Bật/Tắt Giao Thông -->
    <button id="trafficToggleBtn" class="control-btn active" title="Bật/Tắt vệt màu kẹt xe">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="6" r="3"></circle>
        <circle cx="12" cy="12" r="3"></circle>
        <circle cx="12" cy="18" r="3"></circle>
      </svg>
      <span>Kẹt xe</span>
    </button>
  </div>

  <!-- Nút Định Vị Bản Thân GPS (Nổi bên phải, luôn nằm trên Bottom Sheet) -->
  <button id="recenterBtn" class="gps-btn" title="Định vị vị trí của tôi">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <circle cx="12" cy="12" r="7"></circle>
      <line x1="12" y1="1" x2="12" y2="5"></line>
      <line x1="12" y1="19" x2="12" y2="23"></line>
      <line x1="1" y1="12" x2="5" y2="12"></line>
      <line x1="19" y1="12" x2="23" y2="12"></line>
    </svg>
  </button>

  <!-- Bảng thông tin lộ trình tránh kẹt xe (Phía dưới) -->
  <div id="routeSheet" class="route-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-content">
      <div class="route-header">
        <div>
          <span class="route-badge" id="routeBadge">🏍️ XE MÁY • TUYẾN ĐƯỜNG TỐI ƯU</span>
          <div class="route-time-row">
            <span class="route-time" id="routeDuration">-- phút</span>
            <span class="route-distance" id="routeDistance">(-- km)</span>
          </div>
          <div class="route-traffic-status" id="trafficStatus">Mật độ: Thông thoáng</div>
        </div>
      </div>

      <!-- Danh sách các phương án đường đi thay thế (Alternatives như Google Maps) -->
      <div id="routeOptionsContainer" class="route-options"></div>

      <div class="route-actions">
        <button id="startNavBtn" class="nav-btn primary">
          <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Bắt đầu điều hướng
        </button>
        <button id="cancelRouteBtn" class="nav-btn secondary">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Thông báo trạng thái Toast -->
  <div id="toast" class="toast"></div>

  <!-- Script ứng dụng (Cache Busted) -->
  <script src="app.js?v=20261029_2345"></script>
</body>
</html>
